"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "#fefcf9"

[character]
success_symbol = "[❯](#5de2e9)"
error_symbol = "[❯](#EB6959)"
vimcmd_symbol = "[❮](#8aefaf)"

[git_branch]
format = "[$branch]($style)"
style = "#e28b28"

[git_status]
# Keep your current format
format = "[[( $conflicted$untracked$modified$staged$renamed$deleted)]($style) ($ahead_behind$stashed)]($style)"
style = "#8aefaf"  # default color for outer block / $ahead_behind

# ⚔️ Merge conflicts
conflicted = "[⚔️${count}](bold #F0EC35) "

# ? Untracked files
untracked = "[?${count}](cyan) "

# ~ Modified files (unstaged)
modified = "[~${count}](#F0EC35) "

# + Staged / added files
staged = "[+${count}](#35F058) "

# » Renamed files
renamed = "[»${count}](blue) "

# - Deleted files
deleted = "[-${count}](#F0EC35) "

# ↑↓⇕ Commits ahead/behind
ahead = "[↑${count}](#35F058) "
behind = "[↓${count}](#F0EC35) "
diverged = "[⇕↑${ahead_count}↓${behind_count}](#F0EC35 bold) "
stashed = "[≡${count}](#35F058) "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#e28b28"

[cmd_duration]
format = "[$duration]($style) "
style = "#F0EC35"

[python]
format = "[$virtualenv]($style) "
style = "#e28b28"
detect_extensions = []
detect_files = []
